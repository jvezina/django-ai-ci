name: Lint

# Checks this repo's own workflows and scripts: scripts/lint.sh is the single list of checks and pinned tool
# versions (D19). Not reusable: consumers never call it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # provides uvx
      - run: bash scripts/lint.sh
